<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>جاري التحويل</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial;
    background: #fff;
}

.box {
    text-align: center;
}

.loader {
    width: 60px;
    height: 60px;
    border: 6px solid #eee;
    border-top: 6px solid #4285f4;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: auto;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

p {
    color: #555;
    font-size: 18px;
}
</style>
</head>

<body>

<div class="box">
    <div class="loader"></div>
    <p>جاري التحويل...</p>
</div>

<script>
setTimeout(function() {
    window.location.replace("https://www.google.com/");
}, 3000);
</script>

</body>
</html>
